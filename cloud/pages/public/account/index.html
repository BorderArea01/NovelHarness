<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>登录 PIN · 小说</title><link rel="stylesheet" href="/auth-assets/auth.css"><script type="module" src="/auth-assets/auth.mjs"></script></head>
<body data-page="account"><main class="auth-card"><a class="back" href="/novels/">← 小说库</a><h1>登录 PIN</h1><p id="loading" role="status">正在检查账号…</p>
<form id="pin-form" hidden><div id="current-row"><label for="current-pin">当前 PIN</label><input id="current-pin" name="currentPin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" maxlength="12" autocomplete="current-password"></div><label for="new-pin">新 PIN</label><input id="new-pin" name="newPin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" minlength="4" maxlength="12" autocomplete="new-password" required><label for="confirm-pin">再次输入新 PIN</label><input id="confirm-pin" name="confirmPin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" minlength="4" maxlength="12" autocomplete="new-password" required><button id="save-pin" type="submit">保存新 PIN</button><p class="hint">支持 4–12 位数字，公网建议至少 6 位。不会修改书稿、对话或 DeepSeek 配置。</p></form>
<p id="message" role="status" aria-live="polite"></p><p class="hint">修改后，其他设备下次请求或重新连接时需使用新 PIN；已建立的长连接不会强制打断。忘记 PIN 可用部署主机的 owner-key.txt 恢复。</p><form method="post" action="/api/auth/logout"><button class="quiet" type="submit">退出登录</button></form></main></body></html>
