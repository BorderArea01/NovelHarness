<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>小说 · Harness</title>
    <link rel="stylesheet" href="/novel-assets/studio.css">
    <script type="module" src="/novel-assets/studio-entry.mjs"></script>
  </head>
  <body>
    <header><a class="brand" href="/novels/">小说 / Harness</a><nav><a href="/?settings=models">模型</a><a href="/">DSH 对话</a><a href="/account/">账号</a></nav></header>
    <main>
      <section class="seed-box" aria-labelledby="seed-heading">
        <p class="eyebrow">一个念头，就够了</p>
        <h1 id="seed-heading">从这里，长出一个故事。</h1>
        <form id="seed-form">
          <label class="sr-only" for="seed">零碎的灵感</label>
          <textarea id="seed" rows="5" maxlength="12000" placeholder="一个不想成仙的修士，突然能听见飞升者的求救声……" required></textarea>
          <div class="seed-actions"><label class="import-button" for="project-file">导入 / 恢复<input id="project-file" type="file" accept=".json,application/json"></label><button type="submit" id="create-book">准备创作</button></div>
        </form>
      </section>
      <div class="status-row"><p id="status" role="status" aria-live="polite">正在读取书库…</p><button id="cancel" class="quiet" hidden>停止</button></div>
      <section id="import-preview" class="preview" aria-labelledby="preview-heading" hidden>
        <h2 id="preview-heading">导入预览</h2><p id="preview-title"></p><p id="preview-counts"></p><p id="preview-warning" class="muted"></p>
        <div class="actions"><button id="upload">确认导入</button><button id="dismiss" class="quiet">取消</button></div>
      </section>
      <section aria-labelledby="books-heading"><div class="section-heading"><h2 id="books-heading">我的小说</h2><button id="refresh" class="quiet">刷新</button></div><div id="books" class="books"></div></section>
    </main>
    <template id="book-template"><article class="book"><p class="eyebrow">小说工作区</p><h3></h3><p class="book-stats"></p><div class="actions"><button class="open-book">进入创作</button><button class="backup-book quiet" title="先停止本书生成或编辑，再备份最新目录；不含 DSH 对话">备份</button></div></article></template>
  </body>
</html>
