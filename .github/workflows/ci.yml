name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  anonymous-edition:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix cloud/tools ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix cloud/official ci --ignore-scripts --no-audit --no-fund
      - run: node cloud/selfhost/audit-source.mjs
      - run: node scripts/test-git-guard.mjs
      - run: npm run test:public
      - run: node --max-old-space-size=128 cloud/tests/run.mjs
      - run: npm run build
      - run: npm run test:public:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:public:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-ui-failure
          path: |
            test-results/ui-failure.png
            test-results/public-browser.json
            test-results/mode-shared-failure.png
          retention-days: 1
